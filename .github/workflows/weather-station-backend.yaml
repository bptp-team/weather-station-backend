name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: weather-station-backend

jobs:
  containers:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Run the test suite
        run: make test

      - name: Set up Buildx
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/setup-buildx-action@v3

      # On a tag the publish job builds the image that gets pushed, so this build is skipped.
      - name: Build the image
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: containers
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.BACKEND_CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A Basic registry cannot lock tags, so a published version is protected here.
      # "Not found" is the expected outcome, and it makes this step pass.
      - name: Refuse a version that already exists
        run: "! az acr repository show --name ${{ vars.ACR_NAME }} --image ${{ env.IMAGE_NAME }}:${{ github.ref_name }} --output none"

      - name: Sign in to the registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.BACKEND_CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Run Command reaches the VM through the Azure API, so port 22 stays closed to runners.
      # The deploy script lives on the VM, provisioned by the platform repository.
      - name: Deploy ${{ needs.publish.outputs.image }}
        run: >-
          az vm run-command invoke
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --name ${{ vars.AZURE_VM_NAME }}
          --command-id RunShellScript
          --scripts "${{ vars.DEPLOY_SCRIPT }} backend ${{ github.ref_name }}"
          --query "value[0].message" --output tsv

      - name: Verify the API answers in production
        run: curl --fail --silent --show-error --max-time 30 https://${{ vars.PUBLIC_FQDN }}/api/v1/readings/station-01

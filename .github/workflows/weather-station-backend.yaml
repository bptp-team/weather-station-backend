name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: weather-station-backend

jobs:
  containers:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Run the test suite
        run: make test

      # On a tag the publish job builds the same image, so building here would be wasted work.
      - name: Build the image
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: containers
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      # Lets the job exchange a GitHub token for Azure access, so no secret is stored.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A Basic registry cannot lock tags, so a published version is protected here instead.
      - name: Refuse a version that already exists
        run: |
          if az acr repository show-tags --name "${{ vars.ACR_NAME }}" \
               --repository "$IMAGE_NAME" --output tsv 2>/dev/null \
               | grep -qx "${{ github.ref_name }}"; then
            echo "::error::$IMAGE_NAME:${{ github.ref_name }} is already published"
            exit 1
          fi

      - name: Log in to the registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
